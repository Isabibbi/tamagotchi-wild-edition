[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamagotchi-wild"
version = "0.6.0"
description = "Multi-agent care system for a Wildlife Rescue Center."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spade==4.1.4",
    "spade-bdi==0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
tamagotchi-wild = "tamagotchi_wild.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tamagotchi_wild = ["bdi/*.asl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
